name: 每日抓取競品首頁

on:
  schedule:
    # 台灣時間每天 09:10（UTC 01:10）
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: '只抓指定品牌（空白隔開，留空＝全部）'
        required: false
        default: ''
      force:
        description: '強制重存今天的截圖（忽略「沒變動」判斷）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 抓取
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCALE: '2'
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scraper/capture.js ${{ github.event.inputs.brands }}

      - name: Commit 結果
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "今天沒有任何變動"
          else
            git commit -m "capture $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
